<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="330" viewBox="0 0 1140 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Smart ATM interface: access granted, access denied, tamper alarm (illustration)</title>
  <defs>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#1b2029"/>
    </linearGradient>
    <g id="person">
      <!-- shoulders and head silhouette -->
      <path d="M95 250 C100 195 135 178 180 178 C225 178 260 195 265 250 Z" fill="#5b6675"/>
      <ellipse cx="180" cy="122" rx="44" ry="54" fill="#8a96a6"/>
    </g>
  </defs>
  <rect width="1140" height="330" fill="#ffffff"/>

  <!-- Panel 1: access granted -->
  <g transform="translate(15,15)">
    <rect width="360" height="260" rx="10" fill="url(#cam)"/>
    <rect x="70" y="20" width="220" height="190" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
    <text x="76" y="36" fill="#ffffff" fill-opacity="0.8" font-size="12">ROI</text>
    <use href="#person"/>
    <rect x="126" y="60" width="108" height="124" fill="none" stroke="#3cc83c" stroke-width="3"/>
    <text x="126" y="53" fill="#3cc83c" font-size="15" font-weight="700">Visible</text>
    <path d="M0 216 H360 V250 A10 10 0 0 1 350 260 H10 A10 10 0 0 1 0 250 Z" fill="#2e9e44"/>
    <text x="14" y="244" fill="#ffffff" font-size="15" font-weight="700">ACCESS GRANTED · insert your card</text>
  </g>
  <text x="195" y="304" text-anchor="middle" fill="#24292f" font-size="15" font-weight="600">1. Face visible → ATM unlocks</text>

  <!-- Panel 2: access denied -->
  <g transform="translate(390,15)">
    <rect width="360" height="260" rx="10" fill="url(#cam)"/>
    <rect x="70" y="20" width="220" height="190" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
    <text x="76" y="36" fill="#ffffff" fill-opacity="0.8" font-size="12">ROI</text>
    <use href="#person"/>
    <!-- cap and face mask -->
    <path d="M134 98 C136 62 224 62 226 98 Z" fill="#3a4250"/>
    <rect x="128" y="94" width="104" height="10" rx="4" fill="#3a4250"/>
    <path d="M142 128 Q180 120 218 128 L214 160 Q180 178 146 160 Z" fill="#e8eef5"/>
    <rect x="126" y="60" width="108" height="124" fill="none" stroke="#e5484d" stroke-width="3"/>
    <text x="126" y="53" fill="#ff6b6f" font-size="15" font-weight="700">Covered</text>
    <path d="M0 216 H360 V250 A10 10 0 0 1 350 260 H10 A10 10 0 0 1 0 250 Z" fill="#d13438"/>
    <text x="14" y="244" fill="#ffffff" font-size="15" font-weight="700">ACCESS DENIED · please uncover your face</text>
  </g>
  <text x="570" y="304" text-anchor="middle" fill="#24292f" font-size="15" font-weight="600">2. Face covered → access refused</text>

  <!-- Panel 3: tamper alarm -->
  <g transform="translate(765,15)">
    <rect width="360" height="260" rx="10" fill="url(#cam)"/>
    <!-- ATM -->
    <rect x="120" y="40" width="120" height="160" rx="8" fill="#6b7686"/>
    <rect x="136" y="58" width="88" height="56" rx="4" fill="#9fd3ff"/>
    <rect x="146" y="126" width="68" height="40" rx="3" fill="#4a5361"/>
    <rect x="150" y="178" width="60" height="8" rx="3" fill="#222831"/>
    <!-- vibration lines -->
    <g stroke="#ffb020" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M100 80 Q90 100 100 120"/><path d="M84 70 Q70 100 84 130"/>
      <path d="M260 80 Q270 100 260 120"/><path d="M276 70 Q290 100 276 130"/>
    </g>
    <!-- siren -->
    <path d="M300 30 h30 v-6 a15 15 0 0 0 -30 0 z" fill="#ff3b3b"/>
    <rect x="296" y="30" width="38" height="6" rx="2" fill="#c9ced6"/>
    <path d="M0 216 H360 V250 A10 10 0 0 1 350 260 H10 A10 10 0 0 1 0 250 Z" fill="#d13438"/>
    <text x="14" y="244" fill="#ffffff" font-size="15" font-weight="700">ALARM: TAMPERING DETECTED</text>
  </g>
  <text x="945" y="304" text-anchor="middle" fill="#24292f" font-size="15" font-weight="600">3. Machine struck → siren sounds</text>

  <text x="1125" y="324" text-anchor="end" fill="#6e7781" font-size="11">Illustration of the run.py interface, no real faces</text>
</svg>
